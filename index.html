<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laku's Uno</title><style> *{box-sizing:border-box}body{margin:0;background:#101b26;color:#fff;font:16px system-ui;text-align:center}main{max-width:900px;margin:auto;padding:24px}h1{font-size:clamp(36px,8vw,64px);letter-spacing:-2px;font-style:italic;margin:10px;color:#f9d65b}small{color:#a8b9c7}button,input,select{font:inherit;padding:12px;border:0;border-radius:10px;margin:5px}button{cursor:pointer;background:#f9d65b;color:#17212b;font-weight:800}button:disabled{opacity:.4;cursor:default}input{max-width:90%;background:#eaf0f5}.panel{background:#1d3040;border-radius:20px;padding:20px;margin:18px 0}.players{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}.player{padding:12px;background:#293e50;border-radius:12px}.active{outline:2px solid #f9d65b}.card{width:80px;height:116px;border:4px solid #fff;border-radius:13px;color:white;font-size:22px;box-shadow:0 5px 0 #0005;text-shadow:0 2px 3px #0008;display:inline-flex;align-items:center;justify-content:center;margin:4px;vertical-align:middle}.red{background:#d53d53}.blue{background:#286bc8}.green{background:#16966a}.yellow{background:#c18c13}.wild{background:conic-gradient(#d53d53 25%,#286bc8 0 50%,#16966a 0 75%,#c18c13 0)}#hand{display:flex;flex-wrap:wrap;justify-content:center}#error{color:#ff9b9b;min-height:24px}#game{display:none}</style><main><h1>Laku's Uno</h1><small>PLAY YOUR CARDS RIGHT.</small><section id="lobby" class="panel"><h2>Game night, anywhere.</h2><input id="name" placeholder="Your nickname" maxlength="24"><br><button onclick="send('create')">Create room</button><br><input id="code" placeholder="Room code" maxlength="6"><button onclick="send('join')">Join room</button></section><section id="game"><div class="panel">Room <strong id="roomLabel"></strong> <button onclick="share()">Copy invite</button><div id="players" class="players"></div><button id="start" onclick="send('start')">Start game</button></div><div id="table" class="panel"><div id="status"></div><div id="top"></div><p id="colorLabel"></p><button id="draw" onclick="send('draw')">Draw card</button><button id="peno" onclick="send('peno')">UNO!</button><select id="color"><option value="red">Red</option><option value="blue">Blue</option><option value="green">Green</option><option value="yellow">Yellow</option></select><small>Choose color before playing a wild</small><p id="log"></p></div><h3>Your hand</h3><div id="hand"></div></section><p id="error"></p></main><script>let state=null,busy=false;const $=id=>document.getElementById(id);$('code').value=new URLSearchParams(location.search).get('room')||'';async function send(op,extra={}){if(busy)return;busy=true;try{let a=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op,room:state?.room||$('code').value.trim(),token:state?.token,name:$('name').value,...extra})});let s=await a.json();if(s.error){$('error').textContent=s.error;return}state=s;if(op!=='poll')$('error').textContent='';render()}catch(e){$('error').textContent='Connection lost. Retrying…'}finally{busy=false}}function card(c,i){let b=document.createElement(i===undefined?'span':'button');b.className='card '+c.c;b.textContent=c.v;if(i!==undefined){b.disabled=!state.players[state.turn].me||!!state.winner;b.onclick=()=>send('play',{index:i,color:$('color').value})}return b}function render(){let s=state;$('lobby').style.display='none';$('game').style.display='block';$('roomLabel').textContent=s.room;$('players').replaceChildren(...s.players.map((p,i)=>{let d=document.createElement('div');d.className='player '+(s.started&&i===s.turn?'active':'');d.textContent=p.name+(p.me?' (you)':'')+' · '+p.count+' cards'+(p.peno?' · UNO!':'');return d}));$('start').style.display=s.host&&!s.started?'inline-block':'none';$('start').disabled=s.players.length<2;$('table').style.display=s.started?'block':'none';$('status').textContent=s.winner?s.winner+' wins!':s.started?s.players[s.turn].name+"’s turn":'';$('top').replaceChildren(...(s.top?[card(s.top)]:[]));$('colorLabel').textContent=s.color?'Active color: '+s.color:'';$('log').textContent=s.log;$('draw').disabled=!s.started||!s.players[s.turn].me||!!s.winner;$('peno').disabled=s.hand.length!==1||!!s.winner;$('hand').replaceChildren(...s.hand.map(card))}async function share(){let url=new URL(location.href);url.searchParams.set('room',state.room);try{await navigator.clipboard.writeText(url.href);$('error').textContent='Invite copied'}catch(e){prompt('Copy this invite',url.href)}}setInterval(()=>{if(state)send('poll')},800);</script></html>
